<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>クイズバトル</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <!-- 参加画面 -->
  <section id="screen-join" class="screen active">
    <h1 class="logo">クイズバトル</h1>
    <p class="sub">同じWi-Fiでスマホから参加するクイズバトル</p>

    <label class="field">ニックネーム
      <input id="nickname" maxlength="12" placeholder="ニックネームを入力" autocomplete="off">
    </label>

    <div class="field-label">キャラを選ぶ</div>
    <div id="char-grid"></div>
    <div class="field-label hidden" id="local-label">このPCのキャラ（フォルダの画像）</div>
    <div id="local-grid"></div>
    <div class="custom-row">
      <label class="file-btn">写真でキャラを作る
        <input type="file" id="photo-input" accept="image/*" hidden>
      </label>
      <span id="custom-status"></span>
    </div>

    <button id="btn-create" class="primary big">ルームを作る</button>
    <div class="join-row">
      <input id="room-code" maxlength="4" placeholder="ルームコード4文字" autocomplete="off">
      <button id="btn-join" class="big">参加する</button>
    </div>

    <button id="btn-ranking" class="ghost">累計ランキング</button>
    <button id="btn-session-reset" class="ghost hidden">保存したセッションを消して新しく参加</button>

    <div class="qr-box">
      <div class="qr-title">接続アドレス（QRスキャンでもOK）</div>
      <div id="join-url" class="join-url"></div>
      <img id="qr-img" src="/api/qrcode" alt="接続QRコード">
    </div>
  </section>

  <!-- ロビー -->
  <section id="screen-lobby" class="screen">
    <h2>ロビー</h2>
    <div class="room-code-box">ルームコード <span id="lobby-code">----</span></div>
    <img id="lobby-qr" src="/api/qrcode" alt="接続QRコード">
    <ul id="lobby-players" class="player-list"></ul>
    <div id="host-controls">
      <label class="field">科目
        <select id="subject-select">
          <option value="math">算数・数学</option>
          <option value="en">英語</option>
          <option value="ja">国語</option>
        </select>
      </label>
      <label class="field">レベル（全員まとめて）
        <select id="level-select">
          <option value="shou5">小学5年</option>
          <option value="chuu1">中学1年</option>
          <option value="ippan">一般</option>
        </select>
      </label>
      <button id="btn-start" class="primary big">ゲームスタート</button>
    </div>
    <p id="lobby-settings" class="hidden"></p>
    <p id="wait-text" class="hidden">ホストがスタートするのを待っているよ…</p>
  </section>

  <!-- ゲーム画面 -->
  <section id="screen-game" class="screen">
    <div id="players-bar"></div>
    <div class="flip-wrap" id="flip-wrap">
      <div class="my-status">
        <span id="my-score">0点</span>
        <span id="my-streak"></span>
        <span id="my-progress"></span>
      </div>
      <div id="question-card">
        <div id="q-text">問題</div>
        <div id="choices"></div>
        <div id="freeze-overlay" class="hidden"><span>❄ フリーズ！ ❄</span></div>
      </div>
      <div class="inv-title">アイテム（攻撃アイテムは押してから相手をタップ）</div>
      <div id="inventory"></div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen">
    <h2>結果</h2>
    <ol id="result-list"></ol>
    <button id="btn-rematch" class="primary big hidden">もう一度（ホスト）</button>
    <p id="rematch-wait" class="hidden">ホストがもう一度始めるのを待っているよ…</p>
    <button id="btn-result-ranking" class="ghost">累計ランキング</button>
  </section>

  <div id="ranking-modal" class="modal hidden">
    <div class="modal-box">
      <h3>累計ランキング</h3>
      <ol id="ranking-list"></ol>
      <button id="btn-ranking-close" class="big">閉じる</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<button id="btn-sound" title="サウンドON/OFF">🔊</button>
<div id="countdown" class="hidden"></div>
<canvas id="confetti"></canvas>
<script src="/static/app.js"></script>
</body>
</html>
