<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>quiz-battle</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <!-- 입장 화면 -->
  <section id="screen-join" class="screen active">
    <h1 class="logo">quiz-battle</h1>
    <p class="sub">같은 와이파이에서 폰으로 접속하는 퀴즈 배틀</p>

    <label class="field">닉네임
      <input id="nickname" maxlength="12" placeholder="닉네임 입력" autocomplete="off">
    </label>

    <div class="field-label">캐릭터 선택</div>
    <div id="char-grid"></div>
    <div class="custom-row">
      <label class="file-btn">내 사진으로 캐릭터 만들기
        <input type="file" id="photo-input" accept="image/*" hidden>
      </label>
      <span id="custom-status"></span>
    </div>

    <button id="btn-create" class="primary big">방 만들기</button>
    <div class="join-row">
      <input id="room-code" maxlength="4" placeholder="방 코드 4자" autocomplete="off">
      <button id="btn-join" class="big">입장</button>
    </div>

    <button id="btn-ranking" class="ghost">누적 랭킹 보기</button>
    <button id="btn-session-reset" class="ghost hidden">저장된 세션 지우고 새로 입장</button>

    <div class="qr-box">
      <div class="qr-title">접속 주소 (QR을 스캔해도 됩니다)</div>
      <div id="join-url" class="join-url"></div>
      <img id="qr-img" src="/api/qrcode" alt="접속 QR 코드">
    </div>
  </section>

  <!-- 대기실 -->
  <section id="screen-lobby" class="screen">
    <h2>대기실</h2>
    <div class="room-code-box">방 코드 <span id="lobby-code">----</span></div>
    <img id="lobby-qr" src="/api/qrcode" alt="접속 QR 코드">
    <ul id="lobby-players" class="player-list"></ul>
    <div id="host-controls">
      <label class="field">과목
        <select id="subject-select">
          <option value="math">수학 (자동 생성)</option>
          <option value="en">영어 단어</option>
          <option value="ja">일본어</option>
        </select>
      </label>
      <button id="btn-start" class="primary big">게임 시작</button>
    </div>
    <p id="wait-text" class="hidden">방장이 시작하기를 기다리는 중…</p>
  </section>

  <!-- 게임 화면 -->
  <section id="screen-game" class="screen">
    <div id="players-bar"></div>
    <div class="flip-wrap" id="flip-wrap">
      <div class="my-status">
        <span id="my-score">0점</span>
        <span id="my-streak"></span>
        <span id="my-progress"></span>
      </div>
      <div id="question-card">
        <div id="q-text">문제</div>
        <div id="choices"></div>
        <div id="freeze-overlay" class="hidden"><span>동결!</span></div>
      </div>
      <div class="inv-title">아이템 (공격 아이템은 누른 뒤 상대를 탭)</div>
      <div id="inventory"></div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="screen-result" class="screen">
    <h2>결과</h2>
    <ol id="result-list"></ol>
    <button id="btn-rematch" class="primary big hidden">다시 하기 (방장)</button>
    <p id="rematch-wait" class="hidden">방장이 다시 시작하기를 기다리는 중…</p>
    <button id="btn-result-ranking" class="ghost">누적 랭킹 보기</button>
  </section>

  <div id="ranking-modal" class="modal hidden">
    <div class="modal-box">
      <h3>누적 랭킹</h3>
      <ol id="ranking-list"></ol>
      <button id="btn-ranking-close" class="big">닫기</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
